name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create release archive
        run: |
          mkdir -p dist
          zip dist/antigravity-plugin-${{ steps.version.outputs.VERSION }}.zip \
            plugin.yaml __init__.py client.py models.py process.py prompt.py usage.py worker.py \
            README.md CHANGELOG.md LICENSE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Antigravity Plugin ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: dist/antigravity-plugin-${{ steps.version.outputs.VERSION }}.zip
